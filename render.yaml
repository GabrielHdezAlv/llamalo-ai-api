# Blueprint: crea SOLO llamaloiabackend-dev (rama dev) y llamaloiabackend-preprod (rama preprod).
# Producción sigue en el servicio existente "llamaloiabackend" (p. ej. rama new-dev), sin incluirlo aquí.
# Cada variable se copia desde el servicio web "llamaloiabackend" (fromService). Puedes editar valores en el panel después.
version: "1"
services:
  - type: web
    name: llamaloiabackend-dev
    branch: dev
    runtime: node
    repo: https://github.com/GabrielHdezAlv/llamalo-ai-api
    plan: starter
    region: frankfurt
    buildCommand: yarn install --frozen-lockfile && yarn build
    startCommand: yarn start:prod
    healthCheckPath: /ping
    autoDeployTrigger: commit
    envVars:
      - key: STRIPE_PRICE_STARTER
        fromService:
          name: llamaloiabackend
          type: web
          envVarKey: STRIPE_PRICE_STARTER
      - key: STRIPE_PRICE_SCALE
        fromService:
          name: llamaloiabackend
          type: web
          envVarKey: STRIPE_PRICE_SCALE
