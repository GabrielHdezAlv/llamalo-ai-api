# Blueprint: crea SOLO llamaloiabackend-dev (rama dev) y llamaloiabackend-preprod (rama preprod).
# Producción sigue en el servicio existente "llamaloiabackend" (p. ej. rama new-dev), sin incluirlo aquí.
# Tras aplicar el Blueprint, rellena las variables en Render (sync: false).
version: "1"
services:
  - type: web
    name: llamaloiabackend-dev
    branch: dev
    runtime: node
    repo: https://github.com/GabrielHdezAlv/llamalo-ai-api
    plan: starter
    region: frankfurt
    buildCommand: yarn install --frozen-lockfile && yarn build
    startCommand: yarn start:prod
    healthCheckPath: /ping
    autoDeployTrigger: commit
    envVars:
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_SCALE
        sync: false
      - key: STRIPE_PRICE_GROWTH
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: ALLOW_PLAN_CHANGE_MOCK
        sync: false
      - key: NODE_ENV
        sync: false
      - key: SILENCE_PROMPT_TIMEOUT_MS
        sync: false
      - key: SILENCE_HANGUP_TIMEOUT_MS
        sync: false
      - key: SILENCE_TIMEOUT_MS
        sync: false
      - key: MAILERSEND_API_KEY
        sync: false
